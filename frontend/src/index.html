<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <title>Del Valle al Mar — Fincas, cabañas y casas del Cesar a La Guajira</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Alojamientos con el sol del Cesar y el mar de La Guajira: casas, apartamentos, cabañas y fincas en Riohacha, Palomino, Cabo de la Vela, Valledupar, Pueblo Bello y más.">
  <meta name="theme-color" content="#16283f">
  <!-- El árbol de la marca (antes era el ícono por defecto de Angular). SVG para los
       navegadores que lo soportan; el .ico (16/32/48) para el resto. -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Poppins con los pesos que de verdad usan los estilos (400 a 700): antes se pedía
       solo el 400 y el navegador inventaba las negritas. Con <link> y preconnect, y no
       con @import en el CSS, la descarga empieza sin esperar a la hoja de estilos. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
