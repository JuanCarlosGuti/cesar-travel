# cesar-travel en el servidor propio. La marca visible es "Cañaguate Travel";
# el servicio, la imagen, el repo y la base siguen llamándose cesar-travel.
#
# UNA sola aplicación de Kamal, a diferencia de UparYa y crearcodecesar: NestJS
# sirve el Angular ya construido desde backend/public, así que hay un solo
# proceso, un solo puerto y un solo origen.
#
# Dominio canaguatetravel.com con HTTPS desde el 30/09/2026. Antes se sirvió
# por IP, sin host y sin TLS (decisión del 20/08/2026). Ver la sección
# "Dominio y HTTPS" al final antes de cambiar nada de `proxy`.
service: cesar-travel
image: juancarlosguti/cesar-travel

servers:
  web:
    - 159.195.235.225

# El acceso por root está deshabilitado en el servidor.
ssh:
  user: deploy

proxy:
  # Los dos nombres, para que kamal-proxy pida certificado para cada uno. El
  # www no sirve contenido propio: la app lo redirige con 301 al dominio raíz
  # (backend/src/main.ts), porque `--canonical-host` existe en kamal-proxy
  # pero no es una clave de deploy.yml.
  #
  # Declarar host saca a este servicio del papel de destino por omisión de
  # kamal-proxy: ya no responde en la IP pelada ni en nombres sueltos que
  # apunten al servidor sin estar declarados en otro servicio. Es lo que se
  # quiere: un nombre mal apuntado da error en vez de mostrar este sitio.
  hosts:
    - canaguatetravel.com
    - www.canaguatetravel.com
  # Certificado de Let's Encrypt, que kamal-proxy pide solo. Con ssl, además,
  # redirige http → https.
  ssl: true
  # Con ssl: true este ya es el valor por omisión, pero se declara siempre: el
  # default cambia según ssl, y con `true` kamal-proxy conservaría el
  # X-Forwarded-For que mande el cliente — cualquiera podría falsear su IP.
  # Así, kamal-proxy escribe él mismo X-Forwarded-For y X-Forwarded-Proto, y
  # la app confía solo en él (`trust proxy` en backend/src/main.ts).
  forward_headers: false
  app_port: 3000
  healthcheck:
    # Endpoint propio y liviano (backend/src/comun/salud.controller.ts).
    # NO usar /api/municipios, que es lo que apuntaba render.yaml: devuelve los
    # 1.122 municipios del país con su departamento en cada respuesta, y esto
    # se consulta cada pocos segundos.
    path: /api/salud
    interval: 5
    timeout: 10

# Primer arranque: TypeORM crea el esquema con `synchronize`, y después el
# SeedService carga la divipola completa más el catálogo de demostración. Es
# bastante más que arrancar un proceso. Tras el primer despliegue, leer el
# tiempo real del log y dejar esto en unas tres veces eso.
deploy_timeout: 300

registry:
  server: ghcr.io
  username: juancarlosguti
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: .
  dockerfile: Dockerfile
  cache:
    type: registry
    options: mode=max
    image: juancarlosguti/cesar-travel-build-cache

env:
  clear:
    # El Dockerfile ya lo declara; se repite aquí porque es la variable de la
    # que dependen media docena de comportamientos y conviene verla al lado de
    # las demás.
    NODE_ENV: production
    PORT: "3000"
    # LA LÍNEA QUE HACE FALTA PARA QUE ESTO ARRANQUE. database.module.ts tenía
    # `ssl: { rejectUnauthorized: false }` fijo en cuanto existiera
    # DATABASE_URL, porque estaba escrito para Neon. El Postgres de este
    # servidor NO tiene TLS: `pg` pide SSLRequest, el servidor responde que no,
    # y la conexión muere con "The server does not support SSL connections".
    # No es un riesgo: la conexión no sale de la red interna de Docker.
    DATABASE_SSL: "false"
    # Vida del JWT. El código cae a '8h' si falta; se declara para que el valor
    # de producción se lea en un solo sitio.
    JWT_EXPIRACION: 8h
    # CORS_ORIGENES se deja SIN definir a propósito: main.ts solo activa CORS
    # si existe, y aquí el navegador y la API son el mismo origen. Definirla
    # abriría un agujero sin ganar nada.

  secret:
    # postgresql://cesartravel:...@postgres:5432/cesartravel
    - DATABASE_URL
    # Firma de los JWT. Cambiarlo invalida las sesiones vivas.
    - JWT_SECRET
    # Contraseña real del admin que crea el seed en el primer arranque. Si no
    # está definida, el seed genera una al azar y la escribe en el log — que es
    # justo lo que no queremos en un servidor compartido.
    - SEED_ADMIN_PASSWORD

# ---------------------------------------------------------------------------
# Dominio y HTTPS
# ---------------------------------------------------------------------------
#
# DNS en Cloudflare, SOLO DNS (nube gris):
#   A  canaguatetravel.com      → 159.195.235.225
#   A  www.canaguatetravel.com  → 159.195.235.225
# Con la nube naranja (proxy de Cloudflare), el desafío de Let's Encrypt no
# llega a kamal-proxy y el certificado no se emite.
#
# Agregar o cambiar un nombre en `hosts:` es un despliegue, y cada push a main
# despliega (CI). Ese push va DESPUÉS de que el nombre resuelva a esta IP: si
# kamal-proxy pide certificado para un nombre que todavía no llega aquí, la
# validación falla, y Let's Encrypt solo admite 5 fallidas por nombre y hora.
#
# Lo que el HTTPS arregló: el botón "Compartir" de la ficha de un alojamiento
# (frontend/src/app/paginas/detalle/detalle.ts) usa `navigator.share` y, si no
# existe, `navigator.clipboard`. Las dos APIs solo existen en contexto seguro,
# así que mientras se sirvió por HTTP el botón no hacía nada.
